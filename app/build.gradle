plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lingxi.pet'
    compileSdk 34

    defaultConfig {
        applicationId "com.lingxi.pet"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 纯框架实现，无第三方依赖
}
